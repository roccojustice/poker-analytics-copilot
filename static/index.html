<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotlight</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; padding: 0 1.5rem; max-width: 1800px; }
    .bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-start; }
    .seg { display: inline-flex; }
    .seg button { padding: 0.4rem 0.8rem; border: 1px solid #bbb; background: #fff; cursor: pointer; font-size: 0.95rem; }
    .seg button + button { border-left: none; }
    .seg button.on { background: #2b5fab; color: #fff; border-color: #2b5fab; }
    .seg button:disabled { color: #aaa; cursor: not-allowed; }
    .line-box { display: flex; flex-direction: column; }
    #line { width: 14rem; padding: 0.4rem; font-size: 1rem; font-family: monospace; }
    #line-error { color: #b3261e; font-size: 0.85rem; margin-top: 0.25rem; min-height: 1rem; max-width: 28rem; }
    details.formations { position: relative; }
    details.formations summary { list-style: none; padding: 0.4rem 0.8rem; border: 1px solid #bbb; cursor: pointer; min-width: 9rem; max-width: 22rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details.formations summary::after { content: " ▾"; }
    details.formations .panel { position: absolute; z-index: 10; background: #fff; border: 1px solid #bbb; padding: 0.4rem 0.6rem; max-height: 24rem; overflow-y: auto; }
    details.formations label { display: block; padding: 0.15rem 0; white-space: nowrap; cursor: pointer; }
    details.formations label.child { padding-left: 1.2rem; }
    details.formations.off summary { color: #aaa; cursor: not-allowed; }
    #run { padding: 0.4rem 1rem; font-size: 1rem; }
    .dates { display: flex; gap: 0.5rem; align-items: center; }
    .dates input { padding: 0.3rem; font-size: 0.95rem; }
    #output { margin-top: 1.25rem; }
    .filter-line { font-weight: bold; margin-bottom: 0.75rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; font-size: 0.78rem; }
    th, td { border: 1px solid #ddd; padding: 0.25rem 0.4rem; text-align: left; white-space: nowrap; }
    th { background: #f4f4f4; }
    tr:nth-child(even) { background: #fafafa; }
    table.dist { width: auto; font-size: 0.95rem; }
    table.dist [data-pick] { cursor: pointer; }
    table.dist [data-pick]:hover { background: #eef3fb; }
    table.dist .selected { background: #dbe7f8; font-weight: bold; }
    table.dist td small { display: block; color: #666; font-size: 0.75rem; }
    .table-scroll { overflow-x: auto; }
    .wrap { white-space: normal; max-width: 14rem; }
    .error { background: #fdecea; border: 1px solid #f5c2c0; padding: 0.75rem; border-radius: 4px; }
    .card { display: inline-block; padding: 0 4px; margin: 0 1px; border: 1px solid #ccc; border-radius: 3px; background: #fff; font-weight: bold; }
    .card-red { color: #d32f2f; }
    .card-black { color: #222; }
    tr.win td { background: #c8e6c9; }
    tr.loss td { background: #ffcdd2; }
    tr.win td.num:last-child { color: #1b5e20; font-weight: bold; }
    tr.loss td.num:last-child { color: #b71c1c; font-weight: bold; }
    .hand-filter { margin-bottom: 0.5rem; font-size: 0.9rem; }
    .hand-filter input { width: 5rem; padding: 0.2rem; }
    td.num { text-align: right; }
    table.dist tr.sub td:first-child { padding-left: 1.6rem; }
    table.dist tr.sub { color: #444; }
    table.dist th.sub, table.dist td.sub { color: #555; font-size: 0.85rem; }
    .hint { color: #666; font-size: 0.8rem; margin-top: 0.15rem; }
  </style>
</head>
<body>
  <h1>Spotlight</h1>
  <div class="bar">
    <div class="seg" data-key="pot">
      <button data-value="limp" disabled>LIMP</button>
      <button data-value="2bp" class="on">2BP</button>
      <button data-value="3bp">3BP</button>
      <button data-value="4bp" disabled>4BP</button>
    </div>
    <div class="seg" data-key="position">
      <button data-value="oop" class="on">OOP</button>
      <button data-value="ip">IP</button>
    </div>
    <div class="seg" data-key="role">
      <button data-value="pfc" class="on">PFC</button>
      <button data-value="pfr">PFR</button>
    </div>
    <div class="line-box">
      <input id="line" list="line-presets" placeholder="Line, e.g. vs Bs?" autocomplete="off" spellcheck="false">
      <datalist id="line-presets"></datalist>
      <div id="line-error"></div>
      <div class="hint">Size per street: s &lt;45% · m 45–70% · l 70–105% · o ≥105%</div>
    </div>
    <details class="formations" id="formations">
      <summary id="formations-summary">Any</summary>
      <div class="panel" id="formations-panel"></div>
    </details>
    <details class="formations" id="flop-types">
      <summary>Flop: Any</summary>
      <div class="panel"></div>
    </details>
    <details class="formations" id="turn-types">
      <summary>Turn: Any</summary>
      <div class="panel"></div>
    </details>
    <details class="formations" id="river-types">
      <summary>River: Any</summary>
      <div class="panel"></div>
    </details>
    <details class="formations" id="hand-types">
      <summary>Hand: Any</summary>
      <div class="panel"></div>
    </details>
    <div class="dates">
      <label>From <input type="date" id="date-from"></label>
      <label>To <input type="date" id="date-to"></label>
    </div>
    <button id="run" disabled>Run</button>
  </div>
  <div id="output"></div>

  <script type="application/json" id="spot-config">
  {
    "presets": {
      "2bp oop pfc": ["vs B?", "vs B-X-?", "vs X-C-?"],
      "2bp ip pfc": ["vs B?", "vs X?"],
      "3bp oop pfc": ["vs B?", "vs B-X-?"],
      "3bp ip pfc": ["vs B?", "vs B-B?", "vs B-XC-X?"],
      "2bp oop pfr": ["- B-?", "- X-B-?"],
      "2bp ip pfr": ["- B-?", "- B-B-?", "- X-B-?"],
      "3bp oop pfr": ["- B-?", "- B-B-?", "- B-X-?"],
      "3bp ip pfr": ["- B-?", "- B-B-?"]
    },
    "formations": [
      "SB vs BB", "SB vs UTG", "SB vs MP", "SB vs CO", "SB vs BTN",
      "BB vs UTG", "BB vs MP", "BB vs CO", "BB vs BTN",
      "UTG vs MP", "UTG vs CO", "UTG vs BTN",
      "MP vs CO", "MP vs BTN",
      "CO vs BTN"
    ],
    "flop_types": ["BLL", "Low", "2BWL", "Low paired", "High paired", "A high", "Monotone", "3BW"],
    "turn_types": ["FC", "SC", "BP high", "BP mid", "BP low", "BW A", "BW K", "BW Q", "BW J", "FDP", "Brick"],
    "river_types": ["FC", "SC", "BP high", "BP mid", "BP low", "BW A", "BW K", "BW Q", "BW J", "Brick"],
    "hand_types": ["Straight flush", "Quads", "Full house", "Flush", "Straight", "Set", "Trips", "Two pair",
                   "Overpair", "Top pair", "2nd pair", "3rd pair", "Underpair", "Ace high", "No made hand"]
  }
  </script>

  <script>
    const CONFIG = JSON.parse(document.getElementById("spot-config").textContent);
    const state = { pot: "2bp", position: "oop", role: "pfc" };

    const barEl = document.querySelector(".bar");
    const lineEl = document.getElementById("line");
    const lineErrorEl = document.getElementById("line-error");
    const presetsEl = document.getElementById("line-presets");
    const runEl = document.getElementById("run");
    const outputEl = document.getElementById("output");

    let latestRequest = 0;
    let currentHands = [];
    let activePick = null;
    let groupsOf = {};  // hand label -> every pick that selects it
    const resultRange = { min: "", max: "" };

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Bar ---

    document.querySelectorAll(".seg").forEach(seg => {
      seg.addEventListener("click", event => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        state[seg.dataset.key] = button.dataset.value;
        seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === button));
        refreshPresets();
      });
    });

    function refreshPresets() {
      const lines = CONFIG.presets[`${state.pot} ${state.position} ${state.role}`] || [];
      presetsEl.replaceChildren(...lines.map(line => {
        const option = document.createElement("option");
        option.value = line;
        return option;
      }));
    }

    // A checkbox dropdown; returns a getter for the checked values (none checked or disabled = Any).
    // grouped: options sharing a first word ("BP high", "BP low") nest under a parent box ("BP").
    function multiSelect(id, options, summaryText, grouped = false) {
      const el = document.getElementById(id);
      const summaryEl = el.querySelector("summary");
      const panelEl = el.querySelector(".panel");
      const head = option => option.split(" ")[0];
      const groupOf = option =>
        grouped && options.filter(o => head(o) === head(option)).length > 1 ? head(option) : null;
      const addBox = (text, data, cls) => {
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        Object.assign(box.dataset, data);
        if (cls) label.className = cls;
        label.append(box, " " + text);
        panelEl.append(label);
      };
      options.forEach(option => {
        const group = groupOf(option);
        if (group && !panelEl.querySelector(`[data-group="${group}"]`)) addBox(group, { group });
        addBox(option, group ? { value: option, parent: group } : { value: option }, group && "child");
      });
      const leaves = () => [...panelEl.querySelectorAll("input[data-value]")];
      const children = group => [...panelEl.querySelectorAll(`[data-parent="${group}"]`)];
      const checked = () => leaves().filter(box => box.checked).map(box => box.dataset.value);
      const shown = () => {
        const names = [];
        checked().forEach(value => {
          const group = groupOf(value);
          const name = group && children(group).every(box => box.checked) ? group : value;
          if (!names.includes(name)) names.push(name);
        });
        return names;
      };
      panelEl.addEventListener("change", event => {
        const group = event.target.dataset.group;
        if (group) children(group).forEach(box => box.checked = event.target.checked);
        panelEl.querySelectorAll("[data-group]").forEach(parent => {
          const kids = children(parent.dataset.group);
          parent.checked = kids.every(box => box.checked);
          parent.indeterminate = !parent.checked && kids.some(box => box.checked);
        });
        summaryEl.textContent = summaryText(shown());
      });
      summaryEl.addEventListener("click", event => {
        if (el.classList.contains("off")) event.preventDefault();
      });
      document.addEventListener("click", event => {
        if (!el.contains(event.target)) el.open = false;
      });
      const selected = () => el.classList.contains("off") ? [] : checked();
      selected.setEnabled = enabled => {
        el.classList.toggle("off", !enabled);
        if (!enabled) el.open = false;
        panelEl.querySelectorAll("input").forEach(box => box.disabled = !enabled);
      };
      return selected;
    }

    const joinedOrAny = values => values.length ? values.join(", ") : "Any";
    const selectedFormations = multiSelect("formations", CONFIG.formations, joinedOrAny);
    const selectedFlopTypes = multiSelect("flop-types", CONFIG.flop_types, values => "Flop: " + joinedOrAny(values));
    const selectedTurnTypes = multiSelect("turn-types", CONFIG.turn_types, values => "Turn: " + joinedOrAny(values), true);
    const selectedRiverTypes = multiSelect("river-types", CONFIG.river_types, values => "River: " + joinedOrAny(values), true);
    const selectedHandTypes = multiSelect("hand-types", CONFIG.hand_types, values => "Hand: " + joinedOrAny(values));

    // Streets in the Line (1 flop, 2 turn, 3 river), split like line_parser._split_tokens
    function lineStreets(line) {
      return line.replace(/\s+/g, "").replace(/^(-|vs)/i, "").split("-").length;
    }

    function refreshRunoutControls() {
      const streets = lineStreets(lineEl.value);
      selectedTurnTypes.setEnabled(streets >= 2);
      selectedRiverTypes.setEnabled(streets >= 3);
      selectedHandTypes.setEnabled(streets === 1);
    }
    refreshRunoutControls();

    lineEl.addEventListener("input", () => {
      runEl.disabled = !lineEl.value.trim();
      refreshRunoutControls();
    });

    barEl.addEventListener("keydown", event => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && !runEl.disabled) {
        event.preventDefault();
        run();
      }
    });

    runEl.addEventListener("click", run);

    // --- Request ---

    async function run() {
      const requestId = ++latestRequest;
      const body = {
        ...state, line: lineEl.value.trim(), formations: selectedFormations(), flop_types: selectedFlopTypes(),
        turn_types: selectedTurnTypes(), river_types: selectedRiverTypes(), hand_types: selectedHandTypes(),
        date_from: document.getElementById("date-from").value || null,
        date_to: document.getElementById("date-to").value || null,
      };
      lineErrorEl.textContent = "";
      outputEl.innerHTML = "Loading...";

      try {
        const response = await fetch("/spot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (requestId !== latestRequest) return;  // a newer Run superseded this one
        if (response.status === 400) {
          lineErrorEl.textContent = data.error;
          outputEl.innerHTML = "";
        } else if (!response.ok) {
          outputEl.innerHTML = `<div class="error">${escapeHtml(data.error || "Error")}</div>`;
        } else {
          showResult(data);
        }
      } catch (err) {
        if (requestId !== latestRequest) return;
        outputEl.innerHTML = `<div class="error">Error: ${escapeHtml(String(err))}</div>`;
      }
    }

    // --- Result ---

    function showResult(data) {
      currentHands = data.hands;
      activePick = null;
      groupsOf = buildGroups(data.distribution, data.split);
      outputEl.innerHTML =
        `<div class="filter-line">${escapeHtml(data.interpreted_filter)}</div>` +
        (data.split ? renderSplit(data.distribution, data.split) : renderDistribution(data.distribution)) +
        (data.hand_split && data.hand_split.length ? renderHandSplit(data.hand_split) : "") +
        '<h3>Matching hands</h3>' +
        '<div class="hand-filter">Result from ' +
        `<input id="result-min" type="number" step="any" value="${escapeHtml(resultRange.min)}"> to ` +
        `<input id="result-max" type="number" step="any" value="${escapeHtml(resultRange.max)}"> BB ` +
        '· <span id="hand-count"></span></div><div id="hands"></div>';
      outputEl.querySelectorAll("table.dist [data-pick]").forEach(el => {
        el.addEventListener("click", () => togglePick(el.dataset.pick));
      });
      ["min", "max"].forEach(bound => {
        document.getElementById(`result-${bound}`).addEventListener("input", event => {
          resultRange[bound] = event.target.value;
          renderHands();
        });
      });
      renderHands();
    }

    function buildGroups(distribution, split) {
      const groups = {};
      distribution.filter(r => r.parent).forEach(r => groups[r.label] = [r.label, r.parent]);
      (split || []).forEach(row => row.cells.forEach(cell => {
        const all = distribution.find(r => r.action === cell.action).label;
        groups[cell.label] = [cell.label, all, `size:${row.size}`];
      }));
      return groups;
    }

    function togglePick(pick) {
      activePick = activePick === pick ? null : pick;
      outputEl.querySelectorAll("table.dist [data-pick]").forEach(el => {
        el.classList.toggle("selected", el.dataset.pick === activePick);
      });
      renderHands();
    }

    // A "hand:<type>" pick (row header) or "hand:<type>|<label>" (cell); other picks match the label only
    function matchesPick(hand, pick) {
      const labels = groupsOf[hand.measured_action] || [hand.measured_action];
      if (!pick.startsWith("hand:")) return labels.includes(pick);
      const [type, label] = pick.slice("hand:".length).split("|");
      return hand.hand_type === type && (!label || labels.includes(label));
    }

    function renderHands() {
      const a = resultRange.min === "" ? -Infinity : Number(resultRange.min);
      const b = resultRange.max === "" ? Infinity : Number(resultRange.max);
      const [min, max] = [Math.min(a, b), Math.max(a, b)];  // either field order means the same range
      const rows = currentHands.filter(hand =>
        (!activePick || matchesPick(hand, activePick)) &&
        hand.result_bb >= min && hand.result_bb <= max
      );
      document.getElementById("hand-count").textContent =
        `${rows.length.toLocaleString("en-US")} of ${currentHands.length.toLocaleString("en-US")} hands`;
      document.getElementById("hands").innerHTML = renderTable(rows);
    }

    function renderDistribution(distribution) {
      let html = '<table class="dist"><thead><tr><th>Action</th><th>Hands</th><th>%</th></tr></thead><tbody>';
      distribution.forEach(row => {
        html += `<tr data-pick="${escapeHtml(row.label)}"${row.parent ? ' class="sub"' : ""}>` +
          `<td>${escapeHtml(row.label)}</td>` +
          `<td>${row.hands.toLocaleString("en-US")}</td><td>${row.pct.toFixed(1)}%</td></tr>`;
      });
      html += "</tbody></table>";
      return html;
    }

    function renderSplit(distribution, split) {
      const total = distribution.reduce((sum, r) => sum + r.hands, 0);
      const cell = (pick, pct, hands) => `<td data-pick="${escapeHtml(pick)}">${pct.toFixed(1)}%` +
        `<small>${hands.toLocaleString("en-US")}</small></td>`;
      const faced = (hands, pct) => `<td>${hands.toLocaleString("en-US")} (${pct.toFixed(1)}%)</td>`;
      let html = '<table class="dist"><thead><tr><th>Size</th><th>Hands (% faced)</th>';
      distribution.forEach(r => html += `<th>${escapeHtml(r.label)}</th>`);
      html += "</tr></thead><tbody><tr><td>All</td>" + faced(total, total ? 100 : 0);
      distribution.forEach(r => html += cell(r.label, r.pct, r.hands));
      html += "</tr>";
      split.forEach(row => {
        html += `<tr><td data-pick="size:${escapeHtml(row.size)}">${escapeHtml(row.name)}</td>` +
          faced(row.hands, row.pct_faced);
        row.cells.forEach(c => html += cell(c.label, c.pct, c.hands));
        html += "</tr>";
      });
      html += "</tbody></table>";
      return html;
    }

    function renderHandSplit(handSplit) {
      const sub = cell => cell.parent ? ' class="sub"' : "";
      let html = '<table class="dist"><thead><tr><th>Hand type</th><th>Hands (% total)</th>';
      handSplit[0].cells.forEach(cell => html += `<th${sub(cell)}>${escapeHtml(cell.label)}</th>`);
      html += "</tr></thead><tbody>";
      handSplit.forEach(row => {
        const pick = `hand:${row.hand_type}`;
        html += `<tr><td data-pick="${escapeHtml(pick)}">${escapeHtml(row.hand_type)}</td>` +
          `<td>${row.hands.toLocaleString("en-US")} (${row.pct_total.toFixed(1)}%)</td>`;
        row.cells.forEach(cell => {
          html += `<td data-pick="${escapeHtml(`${pick}|${cell.label}`)}"${sub(cell)}>${cell.pct.toFixed(1)}%` +
            `<small>${cell.hands.toLocaleString("en-US")}</small></td>`;
        });
        html += "</tr>";
      });
      html += "</tbody></table>";
      return html;
    }

    const SUIT_SYMBOLS = { c: "♣", d: "♦", h: "♥", s: "♠" };
    const RED_SUITS = new Set(["d", "h"]);

    const text = key => row => formatCell(row[key]);
    const cards = key => row => renderCards(row[key]);
    const action = street => row => renderAction(row[`${street}_act`], row[`${street}_size`]);
    const bb = key => row => formatBB(row[key]);

    const COLUMNS = [
      { label: "Date", render: text("date_played") },
      { label: "Hand #", render: text("hand_no") },
      { label: "Stake", render: text("stake") },
      { label: "Pos", render: text("position") },
      { label: "Cards", render: cards("hole_cards") },
      { label: "Flop", render: cards("flop") },
      { label: "Flop type", render: text("flop_type") },
      { label: "Hand type", render: text("hand_type") },
      { label: "Flop action", render: action("f") },
      { label: "Turn", render: cards("turn") },
      { label: "Turn type", render: text("turn_type") },
      { label: "Turn action", render: action("t") },
      { label: "River", render: cards("river") },
      { label: "River type", render: text("river_type") },
      { label: "River action", render: action("r") },
      { label: "Hero hand", render: text("final_hand"), cls: "wrap" },
      { label: "Winner", render: text("winner") },
      { label: "Winning hand", render: text("winning_hand"), cls: "wrap" },
      { label: "Pot (BB)", render: bb("pot_bb"), cls: "num" },
      { label: "Result (BB)", render: bb("result_bb"), cls: "num" },
    ];

    function renderAction(act, size) {
      if (!act) return "—";
      return escapeHtml(act) + (size === null || size === undefined ? "" : ` ${Math.round(size)}%`);
    }

    function formatBB(value) {
      return value === null || value === undefined ? "—" : value.toFixed(1);
    }

    function renderCards(cardStr) {
      if (!cardStr) return "—";
      return cardStr.trim().split(/\s+/).map(card => {
        const rank = card[0];
        const suit = card[1];
        const colorClass = RED_SUITS.has(suit) ? "card-red" : "card-black";
        return `<span class="card ${colorClass}">${escapeHtml(rank)}${SUIT_SYMBOLS[suit] || suit}</span>`;
      }).join(" ");
    }

    function formatCell(value) {
      if (value === null || value === undefined || value === "") return "—";
      if (typeof value === "number" && !Number.isInteger(value)) return value.toFixed(2);
      return escapeHtml(String(value));
    }

    function renderTable(rows) {
      if (!rows || rows.length === 0) return "<p>No matching hands.</p>";
      let html = '<div class="table-scroll"><table><thead><tr>';
      COLUMNS.forEach(col => html += `<th>${escapeHtml(col.label)}</th>`);
      html += "</tr></thead><tbody>";
      rows.forEach(row => {
        const outcome = row.result_bb > 0 ? "win" : row.result_bb < 0 ? "loss" : "";
        html += outcome ? `<tr class="${outcome}">` : "<tr>";
        COLUMNS.forEach(col => {
          const cellClass = col.cls ? ` class="${col.cls}"` : "";
          html += `<td${cellClass}>${col.render(row)}</td>`;
        });
        html += "</tr>";
      });
      html += "</tbody></table></div>";
      return html;
    }

    refreshPresets();
  </script>
</body>
</html>
