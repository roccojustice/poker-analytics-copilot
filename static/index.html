<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Poker Analytics Copilot</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 4rem; font-size: 1rem; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 1rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Poker Analytics Copilot</h1>
  <textarea id="question" placeholder="e.g. frecuencias de bet en 3bp ip pfr, bb opp"></textarea>
  <br>
  <button id="ask">Preguntar</button>
  <pre id="output"></pre>

  <script>
    const questionEl = document.getElementById("question");
    const outputEl = document.getElementById("output");
    const askButton = document.getElementById("ask");

    async function ask() {
      const question = questionEl.value.trim();
      if (!question) return;

      askButton.disabled = true;
      outputEl.textContent = "Consultando...";

      try {
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = "Error: " + err;
      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener("click", ask);
  </script>
</body>
</html>
